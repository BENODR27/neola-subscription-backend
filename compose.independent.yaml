# Independently managed service. No databases, seeds or sibling build contexts.
name: neola-subscription-backend
services:
  control-api:
    build:
      context: .
    image: ${IMAGE:-neola-subscription-backend:local}
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:7020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    env_file:
      - path: .env.container
        format: raw
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-5005}:7020'
  migrate:
    profiles: [maintenance]
    build:
      context: .
    env_file:
      - path: .env.container
        format: raw
    command: ['sh', '-ec', 'node src/database.js migrate']
